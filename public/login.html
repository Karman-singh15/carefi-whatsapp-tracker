<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Claim Docs</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#14171f; --muted:#667085; --line:#e4e7ec; --brand:#0f766e; --bad:#b42318; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 20px; font-size:14px; }
  label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  input:focus { outline:2px solid var(--brand); outline-offset:-1px; }
  button { width:100%; margin-top:20px; padding:11px; border:0; border-radius:8px; background:var(--brand); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  .err { color:var(--bad); font-size:13px; margin-top:12px; min-height:1em; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Claim Docs</h1>
  <p>Agent sign-in. Patient documents are visible to signed-in agents only.</p>
  <label for="user">Username</label>
  <input id="user" name="user" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button>Sign in</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
  const e = new URLSearchParams(location.search).get('e');
  if (e) document.getElementById('err').textContent = e === 'locked' ? 'Too many attempts. Try again in 15 minutes.' : 'Wrong username or password.';
</script>
</body>
</html>
